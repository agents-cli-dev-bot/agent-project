metrics_to_run:
  - custom_response_quality
  - tool_call_quality

thresholds:
  custom_response_quality: 4  # LLM judge scores 1-5; require ≥4 mean

custom_metrics:
  # Local LLM-as-judge: grades response quality on a 1-5 scale.
  - name: custom_response_quality
    custom_function_file: response_quality.py
  # Count agent turns (informational, no threshold).
  - name: agent_turn_count
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          return {'score': len(turns)}
  # Grade whether the agent called the expected tools.
  - name: tool_call_quality
    custom_function: |
      def evaluate(instance):
          expected = instance.get("expected_tool_use") or []
          if not expected:
              return {"score": 1.0, "explanation": "No tool calls expected"}
          agent_data = instance.get("agent_data") or {}
          actual_tools = []
          for turn in (agent_data.get("turns") or []):
              for event in (turn.get("events") or []):
                  content = event.get("content") or {}
                  for part in (content.get("parts") or []):
                      fc = part.get("function_call") or part.get("functionCall")
                      if fc:
                          actual_tools.append((fc.get("name") or "").lower())
          expected_names = [e["tool_name"].lower() for e in expected]
          hits = sum(1 for name in expected_names if name in actual_tools)
          score = hits / len(expected_names)
          return {
              "score": score,
              "explanation": f"{hits}/{len(expected_names)} expected tools called: {expected_names}",
          }
